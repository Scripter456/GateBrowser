<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GateBrowser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Tab Bar */
    #tab-bar {
      display: flex;
      align-items: center;
      background: #09090b;
      padding: 6px 10px 0 10px;
      overflow-x: auto;
      gap: 6px;
    }
    .tab {
      display: flex;
      align-items: center;
      background: #18181b;
      color: #a1a1aa;
      padding: 8px 14px;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      max-width: 200px;
      cursor: pointer;
      gap: 8px;
      border-top: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .tab.active {
      background: #27272a;
      color: #fafafa;
      border-top: 2px solid #3b82f6;
    }
    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .tab-close {
      cursor: pointer;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #71717a;
    }
    .tab-close:hover {
      background: #3f3f46;
      color: #fafafa;
    }
    #new-tab-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
    }
    #new-tab-btn:hover {
      background: #27272a;
      color: #fff;
    }

    /* Navigation / Toolbar */
    #toolbar {
      display: flex;
      align-items: center;
      background: #27272a;
      padding: 8px 12px;
      gap: 8px;
      border-bottom: 1px solid #3f3f46;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: #f4f4f5;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .nav-btn:hover {
      background: #3f3f46;
    }
    .nav-btn:disabled {
      color: #52525b;
      cursor: not-allowed;
    }
    #url-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 20px;
      padding: 0 12px;
    }
    #url-bar-container:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }
    #url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fafafa;
      font-size: 13px;
      padding: 7px 0;
      user-select: text;
    }

    /* Views */
    #webview-container {
      flex: 1;
      position: relative;
      background: #fff;
    }
    webview {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }
    webview.active {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="tab-bar">
    <div id="tabs-list" style="display: flex; gap: 4px;"></div>
    <button id="new-tab-btn" title="New Tab">+</button>
  </div>

  <div id="toolbar">
    <button class="nav-btn" id="btn-back" title="Back">&#8592;</button>
    <button class="nav-btn" id="btn-forward" title="Forward">&#8594;</button>
    <button class="nav-btn" id="btn-reload" title="Reload">&#8635;</button>
    <button class="nav-btn" id="btn-home" title="Home">&#8962;</button>
    <div id="url-bar-container">
      <input type="text" id="url-input" placeholder="Search with Google or enter address" autocomplete="off" />
    </div>
  </div>

  <div id="webview-container"></div>

  <script>
    const HOME_URL = 'https://www.google.com';
    let tabs = [];
    let activeTabId = null;

    const tabsListEl = document.getElementById('tabs-list');
    const webviewContainer = document.getElementById('webview-container');
    const urlInput = document.getElementById('url-input');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnReload = document.getElementById('btn-reload');
    const btnHome = document.getElementById('btn-home');
    const btnNewTab = document.getElementById('new-tab-btn');

    function createTab(initialUrl = HOME_URL) {
      const id = 'tab-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
      
      // Tab button
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.id = 'tab-btn-' + id;
      tabEl.innerHTML = `
        <span class="tab-title">New Tab</span>
        <span class="tab-close" title="Close Tab">&times;</span>
      `;
      tabEl.addEventListener('click', (e) => {
        if (!e.target.classList.contains('tab-close')) {
          switchTab(id);
        }
      });
      tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(id);
      });

      // Webview
      const webview = document.createElement('webview');
      webview.id = 'webview-' + id;
      webview.src = initialUrl;
      webview.setAttribute('allowpopups', 'true');

      webview.addEventListener('page-title-updated', (e) => {
        tabEl.querySelector('.tab-title').textContent = e.title || 'Untitled';
      });

      webview.addEventListener('did-navigate', (e) => {
        if (activeTabId === id) {
          urlInput.value = e.url;
          updateNavButtons();
        }
      });

      webview.addEventListener('did-navigate-in-page', (e) => {
        if (activeTabId === id) {
          urlInput.value = e.url;
          updateNavButtons();
        }
      });

      tabsListEl.appendChild(tabEl);
      webviewContainer.appendChild(webview);

      const tabData = { id, tabEl, webview };
      tabs.push(tabData);

      switchTab(id);
      return tabData;
    }

    function switchTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        if (t.id === id) {
          t.tabEl.classList.add('active');
          t.webview.classList.add('active');
          urlInput.value = t.webview.getURL ? (t.webview.getURL() || '') : '';
        } else {
          t.tabEl.classList.remove('active');
          t.webview.classList.remove('active');
        }
      });
      updateNavButtons();
    }

    function closeTab(id) {
      const index = tabs.findIndex(t => t.id === id);
      if (index === -1) return;

      const tab = tabs[index];
      tab.tabEl.remove();
      tab.webview.remove();
      tabs.splice(index, 1);

      if (tabs.length === 0) {
        createTab(HOME_URL);
      } else if (activeTabId === id) {
        const nextTab = tabs[Math.max(0, index - 1)];
        switchTab(nextTab.id);
      }
    }

    function getActiveWebview() {
      const t = tabs.find(x => x.id === activeTabId);
      return t ? t.webview : null;
    }

    function updateNavButtons() {
      const wv = getActiveWebview();
      if (!wv || !wv.canGoBack) {
        btnBack.disabled = true;
        btnForward.disabled = true;
        return;
      }
      try {
        btnBack.disabled = !wv.canGoBack();
        btnForward.disabled = !wv.canGoForward();
      } catch (err) {
        // webview not fully loaded
      }
    }

    function navigate(input) {
      let target = input.trim();
      if (!target) return;
      if (!/^https?:\/\//i.test(target)) {
        if (target.includes('.') && !target.includes(' ')) {
          target = 'https://' + target;
        } else {
          target = 'https://www.google.com/search?q=' + encodeURIComponent(target);
        }
      }
      const wv = getActiveWebview();
      if (wv) {
        wv.loadURL(target);
      }
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        navigate(urlInput.value);
      }
    });

    btnBack.addEventListener('click', () => {
      const wv = getActiveWebview();
      if (wv && wv.canGoBack()) wv.goBack();
    });

    btnForward.addEventListener('click', () => {
      const wv = getActiveWebview();
      if (wv && wv.canGoForward()) wv.goForward();
    });

    btnReload.addEventListener('click', () => {
      const wv = getActiveWebview();
      if (wv) wv.reload();
    });

    btnHome.addEventListener('click', () => {
      navigate(HOME_URL);
    });

    btnNewTab.addEventListener('click', () => {
      createTab(HOME_URL);
    });

    // Initialize with first tab
    createTab(HOME_URL);
  </script>
</body>
</html>
